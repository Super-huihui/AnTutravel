<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>云栖山三日团·友群 (45)</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307c160'/%3E%3Cellipse cx='26' cy='28' rx='16' ry='13' fill='%23fff'/%3E%3Cellipse cx='42' cy='40' rx='13' ry='10' fill='%23fff' opacity='.85'/%3E%3Ccircle cx='21' cy='26' r='2.4' fill='%2307c160'/%3E%3Ccircle cx='31' cy='26' r='2.4' fill='%2307c160'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#ededed; --bubble:#ffffff; --self:#95ec69; --ink:#191919; --muted:#9a9a9a;
  --line:#dcdcdc; --top:#f7f7f7; --side:#2e2e2e; --side-ink:#e8e8e8; --accent:#07c160;
  --noise-o:0; --scan-o:0; --vig-o:0; --rgb:0px; --sat:1; --con:1; --side-w:0px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:15.5px;line-height:1.55;overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:var(--accent);color:#fff}

/* ---------- font corruption stages ---------- */
body.f1 .msg-row:not(.self) .btext,
body.f1 .sender,body.f1 .sys,body.f1 .time-div,body.f1 #notice{
  font-family:"KaiTi","STKaiti","楷体","Kaiti SC","PingFang SC",serif;
}
body.f2 .msg-row:not(.self) .btext{
  font-family:"KaiTi","STKaiti","楷体","Songti SC","SimSun",serif;letter-spacing:.07em;
}
body.f2 .sender,body.f2 .sys,body.f2 .time-div,body.f2 #notice{
  font-family:"Songti SC","SimSun",serif;letter-spacing:.1em;
}
body.f3 .msg-row:not(.self) .btext{
  font-family:"Songti SC","SimSun",serif;letter-spacing:.14em;
  text-shadow:0 0 6px rgba(120,20,10,.25);
}
body.f3 .msg-row:nth-child(odd) .bubble{transform:rotate(.35deg)}
body.f3 .msg-row:nth-child(even) .bubble{transform:rotate(-.3deg)}
body.f3 .self .btext{font-family:"KaiTi","STKaiti","楷体",serif;letter-spacing:.08em}

/* ---------- phone chrome ---------- */
#statusbar{
  position:fixed;top:0;left:var(--side-w);right:0;height:26px;z-index:60;
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  font-size:12px;font-weight:600;background:var(--top);color:var(--ink);
  border-bottom:1px solid var(--line);
}
#statusbar .right{display:flex;align-items:center;gap:7px}
.sig{display:inline-flex;gap:1.5px;align-items:flex-end;height:10px}
.sig i{width:2.5px;background:var(--ink);display:block}
.sig i:nth-child(1){height:3px}.sig i:nth-child(2){height:5px}.sig i:nth-child(3){height:7px}.sig i:nth-child(4){height:10px}
.sig i.off{opacity:.18}
#sbBatt{font-variant-numeric:tabular-nums}
#topbar{
  position:fixed;top:26px;left:var(--side-w);right:0;height:50px;z-index:60;
  display:flex;align-items:center;gap:8px;padding:0 14px;
  background:var(--top);border-bottom:1px solid var(--line);
}
#topbar .back{font-size:22px;color:var(--ink);padding:0 4px}
#grpTitle{flex:1;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#grpCount{font-weight:400;color:var(--muted)}
#topbar .icon-btn{font-size:16px;padding:4px 5px;color:var(--ink)}
#notice{
  position:fixed;top:76px;left:var(--side-w);right:0;z-index:59;
  background:var(--top);border-bottom:1px solid var(--line);
  font-size:12.5px;color:var(--muted);padding:7px 16px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#notice b{color:var(--accent);font-weight:600}

/* ---------- sidebar ---------- */
#sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:280px;z-index:70;background:var(--side);color:var(--side-ink);flex-direction:column}
#sidebar .me{padding:22px 18px 14px;display:flex;gap:12px;align-items:center}
#sidebar .me .ava{width:44px;height:44px;border-radius:6px;overflow:hidden;background:#4a4a4a}
#sidebar .me .ava svg{width:100%;height:100%}
#sidebar .me .n{font-size:15px;font-weight:600}
#sidebar .search{margin:0 14px 10px;background:#3a3a3a;border-radius:6px;padding:7px 12px;font-size:12.5px;color:#9a9a9a}
.side-chat{display:flex;gap:11px;padding:12px 16px;cursor:pointer;align-items:center;position:relative}
.side-chat:hover{background:#383838}
.side-chat.active{background:#4a4a4a}
.side-chat .ava{width:42px;height:42px;border-radius:6px;overflow:hidden;flex-shrink:0;background:#555}
.side-chat .ava svg{width:100%;height:100%}
.side-chat .info{flex:1;min-width:0}
.side-chat .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-chat .p{font-size:12px;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.side-chat .badge{position:absolute;left:46px;top:8px;background:#fa5151;color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 4px}
#sideIt{display:none}
#sideIt.show{display:flex}

/* ---------- chat log ---------- */
#log{max-width:680px;margin:0 auto;padding:118px 14px 108px}
.time-div{text-align:center;font-size:11.5px;color:#b2b2b2;margin:18px 0 10px}
.sys{text-align:center;font-size:12px;color:#9a9a9a;margin:12px 24px;line-height:1.6}
.sys .peek{color:#576b95;cursor:pointer;margin-left:6px}
.sys .peeked{display:block;color:#c0392b;margin-top:4px;letter-spacing:.1em}
.msg-row{display:flex;gap:10px;margin:16px 0;align-items:flex-start}
.msg-row.self{flex-direction:row-reverse}
.msg-row .ava{width:40px;height:40px;border-radius:5px;overflow:hidden;flex-shrink:0;background:#d8d8d8}
.msg-row .ava svg{width:100%;height:100%;display:block}
.msg-row .ava.left{filter:grayscale(1) brightness(.6)}
.msg-row .col{max-width:74%;display:flex;flex-direction:column}
.msg-row.self .col{align-items:flex-end}
.sender{font-size:12px;color:#9a9a9a;margin:0 4px 4px}
.sender .tag{color:var(--accent);border:1px solid var(--accent);border-radius:3px;font-size:10px;padding:0 3px;margin-left:5px}
.bubble{position:relative;background:var(--bubble);border-radius:8px;padding:9px 13px;font-size:15.5px;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.bubble::before{content:"";position:absolute;top:13px;left:-5px;border:5px solid transparent;border-right-color:var(--bubble);border-left:0}
.msg-row.self .bubble{background:var(--self)}
.msg-row.self .bubble::before{left:auto;right:-5px;border-right:0;border-left:5px solid transparent;border-left-color:var(--self)}
.bubble .btext{white-space:pre-wrap}
.pop{animation:popIn .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.95)}to{opacity:1;transform:none}}

/* voice */
.bubble.voice{display:flex;align-items:center;gap:9px;min-width:130px;cursor:pointer}
.bubble.voice .play{font-size:15px}
.wave{display:flex;gap:2.5px;align-items:center;height:18px}
.wave i{width:2.5px;background:var(--ink);border-radius:2px;height:5px;opacity:.75}
.wave i:nth-child(2){height:10px}.wave i:nth-child(3){height:15px}.wave i:nth-child(4){height:9px}.wave i:nth-child(5){height:13px}.wave i:nth-child(6){height:6px}
.bubble.voice.playing .wave i{animation:waveAnim .5s ease-in-out infinite alternate}
.bubble.voice.playing .wave i:nth-child(2n){animation-delay:.2s}
@keyframes waveAnim{from{transform:scaleY(.4)}to{transform:scaleY(1.25)}}
.bubble.voice .dur{font-size:13px;color:var(--muted)}
.trans{font-size:12px;color:#576b95;margin:5px 4px 0;cursor:pointer}
.transcript{display:none;font-size:13px;color:var(--muted);margin:5px 4px 0;max-width:250px}
.transcript.show{display:block}

/* red packet */
.bubble.rp{background:linear-gradient(135deg,#fa9d3b,#f2703a);color:#fff;cursor:pointer;display:flex;gap:11px;align-items:center;min-width:200px;padding:13px 15px}
.bubble.rp::before{border-right-color:#f5873c}
.bubble.rp .ric{font-size:27px}
.bubble.rp .rt{font-size:15px}
.bubble.rp .rs{font-size:11px;opacity:.85;margin-top:2px}
.bubble.rp.evil{background:linear-gradient(135deg,#8a2b1d,#4a0f0a)}
.bubble.rp.evil::before{border-right-color:#6e2117}

/* photo */
.bubble.photo{padding:4px;cursor:pointer;line-height:0}
.bubble.photo svg{width:190px;height:119px;border-radius:5px;display:block}
.bubble.photo::before{top:16px}
.photo-cap{font-size:12px;color:var(--muted);margin:5px 4px 0;line-height:1.5}

/* location */
.bubble.loc{padding:0;overflow:hidden;cursor:pointer;width:236px}
.bubble.loc .lt{font-size:14px;padding:9px 12px 2px}
.bubble.loc .la{font-size:11.5px;color:var(--muted);padding:0 12px 8px}
.bubble.loc svg{width:100%;height:96px;display:block}
.bubble.loc::before{top:16px}

/* card */
.bubble.card{padding:0;overflow:hidden;width:250px}
.bubble.card .ct{font-size:14.5px;font-weight:600;padding:11px 13px;border-bottom:1px solid var(--line)}
.bubble.card .cr{display:flex;gap:9px;font-size:12.5px;color:var(--muted);padding:7px 13px}
.bubble.card .cr b{color:var(--accent);font-family:"Courier New",monospace}
.bubble.card .cf{font-size:11px;color:#b2b2b2;padding:6px 13px 9px;border-top:1px solid var(--line)}
.bubble.card::before{top:16px}

/* chain */
.bubble.chain{width:236px}
.bubble.chain .cht{font-weight:600;font-size:14.5px;margin-bottom:7px}
.chain-item{font-size:13.5px;color:var(--ink);padding:2.5px 0}
.chain-item.struck{text-decoration:line-through;color:#b2b2b2}
.chain-item.you{color:#c0392b;font-weight:700}
.chain-foot{font-size:11.5px;color:#b2b2b2;margin-top:7px;border-top:1px solid var(--line);padding-top:7px}

/* typing */
.typing-bubble{display:inline-flex;gap:4px;padding:13px 15px}
.typing-bubble i{width:6px;height:6px;border-radius:50%;background:#b2b2b2;animation:typ 1s infinite}
.typing-bubble i:nth-child(2){animation-delay:.18s}
.typing-bubble i:nth-child(3){animation-delay:.36s}
@keyframes typ{0%,100%{opacity:.25;transform:translateY(0)}45%{opacity:1;transform:translateY(-3px)}}

/* new message pill */
#newPill{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:65;display:none;
  background:var(--bubble);border:1px solid var(--line);border-radius:20px;padding:7px 18px;
  font-size:12.5px;color:var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;
}
#newPill.show{display:block}

/* ---------- input bar ---------- */
#inputbar{
  position:fixed;bottom:0;left:var(--side-w);right:0;z-index:60;
  display:flex;align-items:center;gap:9px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:var(--top);border-top:1px solid var(--line);
}
#inputbar .icon-btn{font-size:21px;color:var(--ink);padding:2px}
#chatInput{flex:1;background:var(--bubble);border:none;border-radius:6px;padding:9px 12px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;min-width:0}
#sendBtn{display:none;background:var(--accent);color:#fff;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:600}
#sendBtn.show{display:block}
#plusPanel{position:fixed;bottom:64px;left:var(--side-w);right:0;z-index:59;display:none;background:var(--top);border-top:1px solid var(--line);padding:18px 26px;gap:30px}
#plusPanel.open{display:flex}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.plus-item .pic{width:52px;height:52px;border-radius:12px;background:var(--bubble);display:flex;align-items:center;justify-content:center;font-size:23px;border:1px solid var(--line)}

/* ---------- overlays ---------- */
#noise,#scan,#vig,#blinkTop,#blinkBot,#subliminal,#whispers,#flash,#scare{position:fixed;inset:0;pointer-events:none}
#noise{z-index:90;opacity:var(--noise-o);animation:noiseShift .38s steps(3) infinite;background-repeat:repeat}
@keyframes noiseShift{0%{background-position:0 0}33%{background-position:-46px 32px}66%{background-position:30px -58px}100%{background-position:-12px -20px}}
#scan{z-index:91;opacity:var(--scan-o);background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
#vig{z-index:92;opacity:var(--vig-o);background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.85) 100%)}
#blinkTop,#blinkBot{z-index:95;background:#000;transition:transform .13s ease-in}
#blinkTop{bottom:auto;height:52vh;transform:scaleY(0);transform-origin:top}
#blinkBot{top:auto;height:52vh;transform:scaleY(0);transform-origin:bottom}
#blinkTop.closed,#blinkBot.closed{transform:scaleY(1)}
#whispers{z-index:93}
.whisper{position:absolute;font-family:"KaiTi","STKaiti","Songti SC","SimSun",serif;color:#cfc4b6;text-shadow:0 0 10px #000;letter-spacing:.3em;animation:whisperFade 3.8s forwards;white-space:nowrap}
@keyframes whisperFade{0%{opacity:0;transform:translateY(8px)}18%{opacity:.6}70%{opacity:.35}100%{opacity:0;transform:translateY(-16px)}}
#subliminal{z-index:96;display:none;place-items:center;background:rgba(0,0,0,.35)}
#subliminal svg{width:56vmin;opacity:.9}
#flash{z-index:97;background:radial-gradient(circle,#7a0c06,#1a0302 75%);opacity:0}
#scare{z-index:400;display:none;place-items:center;background:#000}
#scare svg{width:min(100vmin,940px);filter:contrast(1.35) saturate(1.1) brightness(1.05)}
#scare.jitter svg{animation:scareJitter .055s steps(2) infinite}
@keyframes scareJitter{0%{transform:translate(-9px,5px) scale(1.03)}50%{transform:translate(8px,-7px) scale(1.06)}100%{transform:translate(-5px,-4px) scale(1.02)}}
.glitch{animation:glitchAnim .24s steps(2,end) both}
@keyframes glitchAnim{
  0%{clip-path:inset(12% 0 61% 0);transform:translateX(-7px)}
  25%{clip-path:inset(52% 0 18% 0);transform:translateX(6px)}
  50%{clip-path:inset(28% 0 44% 0);transform:translateX(-4px) skewX(1.2deg)}
  75%{clip-path:inset(70% 0 6% 0);transform:translateX(5px)}
  100%{clip-path:none;transform:none}
}
.flicker{animation:flick .3s steps(3)}
@keyframes flick{0%,100%{opacity:1}33%{opacity:.1}66%{opacity:.7}}
.btext{text-shadow:var(--rgb) 0 rgba(255,0,70,.45),calc(var(--rgb) * -1) 0 rgba(0,255,240,.3)}

/* toasts */
#toasts{position:fixed;top:112px;right:14px;z-index:120;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{min-width:220px;max-width:300px;background:var(--bubble);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:12.5px;box-shadow:0 10px 26px rgba(0,0,0,.22);animation:toastIn .3s ease-out;color:var(--ink)}
.toast .t-title{font-weight:700;font-size:11.5px;color:var(--muted);margin-bottom:2px}
@keyframes toastIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}

/* modal */
#modal{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:rgba(0,0,0,.72);padding:20px}
#modal.open{display:grid}
#modalCard{background:var(--bubble);border-radius:12px;max-width:min(420px,94vw);max-height:86vh;overflow:auto;width:100%;position:relative;color:var(--ink)}
#modalCard .mclose{position:absolute;top:8px;right:10px;font-size:20px;color:var(--muted);z-index:2;padding:4px}
.m-photo svg{width:100%;display:block;border-radius:12px 12px 0 0}
.m-photo .hid{opacity:0;transition:opacity 1.6s}
.m-photo.reveal .hid{opacity:1}
.m-cap{padding:12px 16px;font-size:13px;color:var(--muted)}
.m-rp{background:linear-gradient(160deg,#fa9d3b,#e85d2a);color:#fff;text-align:center;padding:34px 24px 28px;border-radius:12px}
.m-rp.evil{background:linear-gradient(160deg,#7e2418,#300a06)}
.m-rp .from{font-size:14px;opacity:.9}
.m-rp .greet{font-size:19px;margin:14px 0 24px}
.m-rp .open-coin{width:64px;height:64px;border-radius:50%;background:#ffd9a0;color:#a3541c;margin:0 auto;font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:transform .5s}
.m-rp .open-coin.spin{transform:rotateY(720deg) scale(.9)}
.m-rp .result{display:none;margin-top:22px;font-size:15px;line-height:1.9}
.m-rp .result.show{display:block}
.m-rp .result b{font-size:26px}
.m-loc .lt{font-size:15px;font-weight:600;padding:14px 16px 2px}
.m-loc .la{font-size:12px;color:var(--muted);padding:0 16px 10px}
.m-loc svg{width:100%;display:block}
.m-loc .dist{padding:11px 16px;font-size:13px;color:#c0392b;border-top:1px solid var(--line)}
.m-preview{padding:18px 18px 22px}
.m-preview h4{font-size:15px;margin-bottom:14px}
.m-preview .pm{display:flex;gap:9px;margin-bottom:12px;font-size:13.5px}
.m-preview .pm .pa{width:32px;height:32px;border-radius:4px;overflow:hidden;flex-shrink:0}
.m-preview .pm .pa svg{width:100%;height:100%}
.m-preview .pm .pb{background:var(--bg);border-radius:6px;padding:7px 11px}
.m-preview .pnote{font-size:11.5px;color:var(--muted);margin-top:14px;text-align:center}

/* drawer */
#drawerBg{position:fixed;inset:0;z-index:240;background:rgba(0,0,0,.4);display:none}
#drawerBg.open{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;z-index:250;width:min(340px,92vw);background:var(--bg);transform:translateX(102%);transition:transform .28s;overflow-y:auto;padding:20px 18px 30px}
#drawer.open{transform:none}
#drawer h3{font-size:16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
#drawer h3 button{font-size:19px;color:var(--muted)}
.d-sec{font-size:12px;color:var(--muted);margin:18px 0 9px}
.d-members{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.d-m{text-align:center;font-size:11px;color:var(--muted)}
.d-m .ava{width:44px;height:44px;border-radius:5px;overflow:hidden;margin:0 auto 4px;background:#d8d8d8}
.d-m .ava svg{width:100%;height:100%}
.d-m .st{font-size:10px;color:var(--accent)}
.d-m .st.bad{color:#c0392b}
.d-m .st.off{color:#b2b2b2}
.d-m.left .ava{filter:grayscale(1) brightness(.6)}
.d-notice{background:var(--bubble);border-radius:8px;padding:11px 13px;font-size:13px;color:var(--ink)}
.d-row{display:flex;justify-content:space-between;background:var(--bubble);border-radius:8px;padding:12px 13px;font-size:14px;margin-bottom:8px}
.d-row .v{color:var(--muted);font-size:13px}
#quitBtn{width:100%;background:var(--bubble);color:#fa5151;border-radius:8px;padding:13px;font-size:15px;margin-top:18px}

/* aftermath */
#aftermath{position:fixed;inset:0;z-index:350;display:none;place-items:center;background:#0a0908;padding:24px}
#aftermath.open{display:grid}
#aftermath .card{max-width:560px;text-align:center;color:#8d8d8d}
#aftermath .big{font-size:22px;color:#b9b3a8;margin-bottom:20px;font-family:"KaiTi","STKaiti","Songti SC","SimSun",serif;letter-spacing:.2em}
#aftermath p{margin-bottom:15px;font-size:14.5px}
#aftermath .small{font-size:12px;color:#5f5f5f;line-height:1.9;margin-bottom:30px}
#aftermath .btn{display:inline-block;background:#3a3f55;color:#fff;border-radius:8px;padding:12px 30px;font-size:15px}
#stayLink{display:block;margin-top:20px;font-size:12px;color:#4c4c4c;cursor:pointer}
#stayLink:hover{color:#a33}

@media (min-width:1000px){
  :root{--side-w:280px}
  #sidebar{display:flex}
  body{padding-left:280px}
}
@media (prefers-reduced-motion:reduce){
  #noise{animation:none}
  .typing-bubble i{animation:none}
  .pop{animation:none}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  if(idx===MSGS.length)ensureFinale();
  if(idx>=timeline.length)return;
  applyEvent(timeline[idx++]);
}
function applyEvent(ev){
  if(ev.k==='fline'){
    finaleStarted=true;
    var tn=makeTypingRow('it');log.appendChild(tn);afterAppend(tn);
    setTimeout(function(){
      if(tn.parentNode)tn.parentNode.removeChild(tn);
      var n=appendMsg({k:'text',w:'it',t:ev.t});
      if(ev.red){var bb=n.querySelector('.bubble');bb.style.background='#5a1210';bb.style.color='#f0d8d0'}
      sound.arrive(1,ev.red);afterAppend(n);
      scheduleNext(ev.wait);
    },1300);
    return;
  }
  if(ev.k==='scare'){doScare();scheduleNext(ev.wait);return}
  if(ev.k==='aftermath'){
    $('#aftermath').classList.add('open');
    finaleDone=true;locked=false;sound.hush();
    return;
  }
  var m=ev.m;
  if(m.k==='time'||m.k==='sys'||m.k==='recall'){
    var n=appendMsg(m);
    if(m.notify)sound.arrive(sp,true);
    afterAppend(n);
    scheduleNext(ev.wait);
    return;
  }
  if(m.k==='self'){
    var n2=appendMsg(m);
    sound.arrive(sp,true);
    if(navigator.vibrate)navigator.vibrate(60);
    afterAppend(n2);
    scheduleNext(ev.wait);
    return;
  }
  var tn2=makeTypingRow(m.w);log.appendChild(tn2);afterAppend(tn2);
  var typMs=clamp(380+(m.t||m.title||'').length*36,420,1700)*(sp>.6?1.25:1);
  setTimeout(function(){
    if(paused){ /* finish typing, then hold */ }
    if(tn2.parentNode)tn2.parentNode.removeChild(tn2);
    var n3=appendMsg(m);
    sound.arrive(sp,m.w==='it');
    afterAppend(n3);
    scheduleNext(ev.wait);
  },typMs);
}

function zalgo(s,intensity){
  var out='';
  for(var i=0;i<s.length;i++){out+=s[i];
    if(Math.random()<intensity){out+=MARKS[Math.floor(Math.random()*MARKS.length)];
      if(Math.random()<intensity*.5)out+=POOL[Math.floor(Math.random()*POOL.length)]}}

}

  });

    if(!e.dataset.orig)e.dataset.orig=e.textContent;
    e._busy=true;

    (function(x){setTimeout(function(){x.textContent=x.dataset.orig;x._busy=false},rand(350,1100))})(e);
  }
}

  sound.scream();
  setTimeout(function(){scare.style.display='none'},160);
  spawnWhisper();
});
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&locked){
    locked=false;input.disabled=false;input.placeholder='说点什么…';
    toast('……','你退群了。它有点失望。');
  }
});

/* ================= schedulers ================= */
var nextGlitch=performance.now()+3500,nextWhisper=performance.now()+6000,
    nextBlink=performance.now()+9000,nextSub=performance.now()+12000;

/* ================= main loop ================= */
var last=performance.now(),frameCount=0;
function frame(now){
  var dt=Math.min(80,now-last);last=now;frameCount++;
  var target=clamp(idx/TOTAL,0,1);
  sp+=(target-sp)*Math.min(1,dt/600);

  var st=root.style;
  st.setProperty('--bg',stops(PAL.bg,sp));
  st.setProperty('--bubble',stops(PAL.bubble,sp));
  st.setProperty('--self',stops(PAL.self,sp));
  st.setProperty('--ink',stops(PAL.ink,sp));
  st.setProperty('--muted',stops(PAL.muted,sp));
  st.setProperty('--line',stops(PAL.line,sp));
  st.setProperty('--top',stops(PAL.top,sp));
  st.setProperty('--side',stops(PAL.side,sp));
  st.setProperty('--accent',stops(PAL.accent,sp));
  st.setProperty('--noise-o',clamp((sp-.28)*1.2,0,.55).toFixed(3));
  st.setProperty('--scan-o',clamp((sp-.4)*1.4,0,.45).toFixed(3));
  st.setProperty('--vig-o',(sp*.8).toFixed(3));
  st.setProperty('--sat',(1-.3*Math.sin(Math.PI*Math.min(1,sp*1.15))+sp*.12).toFixed(3));
  st.setProperty('--con',(1+sp*.13).toFixed(3));

  if(frameCount%20===0){
    $('#sbBatt').textContent=Math.max(1,100-Math.floor(sp*99))+'%';
    var off=Math.floor(sp*4.5);
    $$('#sbSig i').forEach(function(b,i){b.classList.toggle('off',i>=4-off)});
  }
  if(frameCount%4===0){
    $('#faceDisp').setAttribute('scale',String((2+sp*22).toFixed(1)));
  }

  runMorphs(sp);

  if(now>=nextGlitch&&sp>.34){glitchBurst();nextGlitch=now+rand(1800,5200)*(1.35-sp)}
  if(now>=nextWhisper&&sp>.5){spawnWhisper();nextWhisper=now+rand(4000,9000)*(1.4-sp)}
  if(now>=nextBlink&&sp>.62){pageBlink();nextBlink=now+rand(7000,16000)}
  if(now>=nextSub&&sp>.78){subliminal();nextSub=now+rand(7000,14000)}

  if(frameCount%9===0)sound.update(sp);
  sound.heartbeat(now,finaleStarted&&!finaleDone?1:sp);

  if(now<shakeUntil&&!RM){
    document.body.style.transform='translate('+rand(-8,8).toFixed(1)+'px,'+rand(-6,6).toFixed(1)+'px)';
  }else if(document.body.style.transform){document.body.style.transform=''}

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
